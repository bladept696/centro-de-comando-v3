# Constrói o Centro de Comando para Mac (Apple Silicon e Intel) e Linux (AppImage x86_64).
# Corre à mão (Actions → "Build Mac e Linux" → Run workflow) ou quando se publica uma tag v*.
# Os ficheiros ficam como "artifacts" do run: NÃO são assinados aqui. A assinatura Ed25519 das atualizações
# faz-se sempre no PC do autor (sign_release.py), e só depois os ficheiros vão para a release.
name: Build Mac e Linux

on:
  workflow_dispatch:
    inputs:
      rosetta:
        description: 'Só o Mac Intel, compilado por Rosetta num Mac ARM (quando não há máquinas macos-15-intel livres)'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    if: ${{ !inputs.rosetta }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon (arm64)
          - os: macos-15-intel    # Intel (x64); o macos-13 foi desativado pelo GitHub
          - os: ubuntu-22.04      # glibc mais antiga = o AppImage abre em mais distribuições
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgirepository1.0-dev gir1.2-ayatanaappindicator3-0.1 libfuse2 file
      - name: Configuração da carteira
        env:
          HC_BREEZ_KEY: ${{ secrets.HC_BREEZ_KEY }}
        run: |
          if [ -n "$HC_BREEZ_KEY" ]; then python -c "import json,os; json.dump({'api_key': os.environ['HC_BREEZ_KEY']}, open('breez.json','w'))"; fi
      - name: Build
        env:
          PYTHON: python
        run: bash build_unix.sh
      - uses: actions/upload-artifact@v4
        with:
          name: centrodecomando-${{ matrix.os }}
          path: |
            Output/*.zip
            Output/*.AppImage
          if-no-files-found: error

  # Mac Intel pelo Rosetta: Python x64 numa máquina Apple Silicon gera um .app x86_64 igual ao do runner Intel.
  mac-intel-rosetta:
    if: ${{ inputs.rosetta }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build (x86_64 pelo Rosetta)
        run: |
          softwareupdate --install-rosetta --agree-to-license || true
          # every python call (pip and PyInstaller included) must run as x86_64, or pip picks arm64 wheels
          REAL="$(which python)"
          echo '#!/bin/bash' > "$RUNNER_TEMP/py86"
          echo "exec arch -x86_64 \"$REAL\" \"\$@\"" >> "$RUNNER_TEMP/py86"
          cat "$RUNNER_TEMP/py86"
          chmod +x "$RUNNER_TEMP/py86"
          "$RUNNER_TEMP/py86" -c "import platform; print('python', platform.machine())"
          PYTHON="$RUNNER_TEMP/py86" arch -x86_64 /bin/bash build_unix.sh
          file dist/CentroDeComando.app/Contents/MacOS/CentroDeComando
      - uses: actions/upload-artifact@v4
        with:
          name: centrodecomando-mac-x64-rosetta
          path: Output/*-mac-x64.zip
          if-no-files-found: error
