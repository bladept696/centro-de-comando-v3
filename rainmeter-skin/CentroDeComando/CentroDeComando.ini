; ============================================================================
; CENTRO DE COMANDO - Widget Rainmeter
; Mostra o hashrate, potência e temperatura da farm no ambiente de trabalho.
;
; REQUISITO: o Centro de Comando (app.py / CentroDeComando.exe) tem de estar
; a correr em localhost:8765 (é ele quem serve os dados em /api/overlay).
;
; Para mostrar mais do que 4 máquinas: copia um dos blocos "MÁQUINA N" lá em
; baixo, troca "m1_" por "m2_"/"m3_".."m8_" nos RegExp, e acrescenta o meter
; correspondente. O backend suporta até 8 máquinas neste endpoint.
; ============================================================================

[Rainmeter]
Update=5000
DynamicWindowSize=1
AccurateText=1

[Metadata]
Name=Centro de Comando - Mining Farm
Author=Centro de Comando
Information=Hashrate, potência e temperatura da sala de mineração (NerdQAxe++ / LuxOS), lidos do Centro de Comando local.
Version=1.0

[Variables]
Host=http://localhost:8765

; --- Download único (as restantes medidas reutilizam este corpo, sem repetir o pedido HTTP) ---
[MeasureData]
Measure=WebParser
URL=#Host#/api/overlay/rainmeter
UpdateRate=5
RegExp=(?siU)(.*)

; --- Totais da farm ---
[MeasureFarmHash]
Measure=WebParser
URL=[MeasureData]
RegExp=(?siU)"farm_total_hashrate_ths":\s*([0-9.]*)
StringIndex=1

[MeasureFarmPower]
Measure=WebParser
URL=[MeasureData]
RegExp=(?siU)"farm_total_power_w":\s*([0-9.]*)
StringIndex=1
Substitute="":"N/D"

[MeasureFarmTemp]
Measure=WebParser
URL=[MeasureData]
RegExp=(?siU)"farm_avg_temp_c":\s*([0-9.]*)
StringIndex=1
Substitute="":"N/D"

[MeasureFarmOnline]
Measure=WebParser
URL=[MeasureData]
RegExp=(?siU)"farm_online_count":\s*([0-9]*)
StringIndex=1

[MeasureFarmTotal]
Measure=WebParser
URL=[MeasureData]
RegExp=(?siU)"farm_total_count":\s*([0-9]*)
StringIndex=1

; --- Máquina 1 ---
[MeasureM1Name]
Measure=WebParser
URL=[MeasureData]
RegExp=(?siU)"m1_name":\s*"([^"]*)"
StringIndex=1
Substitute="":"—"

[MeasureM1Online]
Measure=WebParser
URL=[MeasureData]
RegExp=(?siU)"m1_online":\s*"([^"]*)"
StringIndex=1
Substitute="1":"●","0":"○","":""

[MeasureM1Hash]
Measure=WebParser
URL=[MeasureData]
RegExp=(?siU)"m1_hashrate_ths":\s*([0-9.]*)
StringIndex=1
Substitute="":"—"

[MeasureM1Temp]
Measure=WebParser
URL=[MeasureData]
RegExp=(?siU)"m1_temp_c":\s*([0-9.]*)
StringIndex=1
Substitute="":"—"

; --- Máquina 2 ---
[MeasureM2Name]
